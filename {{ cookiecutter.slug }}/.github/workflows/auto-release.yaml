name: Autorelease
on:
  pull_request:
    types:
      - synchronize
      - labeled
      - unlabeled
      - closed

permissions:
  # push the release tag
  contents: write
  # comment the planned version on the PR
  pull-requests: write
  # dispatch the Release workflow for the new tag
  actions: write

jobs:
  create-release-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Create new tag
        uses: projectsyn/pr-label-tag-action@v1
        with:
          trigger: |
            Release
